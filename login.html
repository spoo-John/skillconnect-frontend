<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    html {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 40px 50px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      width: 360px;
      animation: fadeInUp 0.6s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #ffffff;
      font-size: 46px;
      margin-bottom: 30px;
      margin-top: 0;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
      letter-spacing: -1px;
    }

    label {
      color: #8ab4f8;
      font-size: 17px;
      font-weight: 600;
      display: block;
      margin: 15px 0 6px;
      text-align: left;
    }

    input {
      width: 280px;
      padding: 12px;
      font-size: 16px;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      outline: none;
      transition: 0.3s ease;
      box-sizing: border-box;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input:focus {
      border-color: #8ab4f8;
      box-shadow: 0 0 10px rgba(138, 180, 248, 0.6);
    }

    button {
      margin-top: 25px;
      padding: 14px 32px;
      font-size: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, #1f1f1f, #3a3a3a);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      width: 100%;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      margin: 20px 0 0;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13px;
    }

    .divider a {
      color: #8ab4f8;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .divider a:hover {
      opacity: 0.75;
    }

    .field-wrap {
      text-align: left;
    }

    /* Error / success message */
    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: left;
    }

    .msg.error {
      background: rgba(255, 80, 80, 0.2);
      border: 1px solid rgba(255, 80, 80, 0.4);
      color: #ff8080;
      display: block;
    }

    .msg.success {
      background: rgba(80, 255, 150, 0.2);
      border: 1px solid rgba(80, 255, 150, 0.4);
      color: #80ffaa;
      display: block;
    }
  </style>
</head>
<body>
  <div class="glass">
    <h1>Sign In</h1>

    <div class="field-wrap">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
    </div>

    <div class="field-wrap">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      />
    </div>

    <button id="loginBtn" onclick="handleLogin()">Login</button>

    <div id="msg" class="msg"></div>

    <p class="divider">Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script>
    const API = 'http://localhost:5000/api'

    async function handleLogin() {
      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value.trim()
      const btn = document.getElementById('loginBtn')
      const msg = document.getElementById('msg')

      // Reset message
      msg.className = 'msg'
      msg.textContent = ''

      // Basic validation
      if (!email || !password) {
        showMsg('Please fill in all fields.', 'error')
        return
      }

      // Loading state
      btn.disabled = true
      btn.textContent = 'Signing in...'

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })

        const data = await res.json()

        if (!res.ok) {
          showMsg(data.error || 'Login failed.', 'error')
          return
        }

        // Save token and user to localStorage
        localStorage.setItem('token', data.token)
        localStorage.setItem('user', JSON.stringify(data.user))

        showMsg('Login successful! Redirecting...', 'success')

        // Redirect based on role
        setTimeout(() => {
          if (data.user.role === 'professional') {
            window.location.href = 'profile.html'
          } else {
            window.location.href = 'dashboard.html'
          }
        }, 1000)

      } catch (err) {
        showMsg('Cannot connect to server. Make sure backend is running.', 'error')
      } finally {
        btn.disabled = false
        btn.textContent = 'Login'
      }
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg')
      msg.textContent = text
      msg.className = `msg ${type}`
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin()
    })
  </script>
</body>
</html>
