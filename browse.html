<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Professionals — SkillConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f5f9;
      --border: #e2e8f0;
      --primary-blue: #2563eb;
      --success-green: #059669;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg-main);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      color: var(--text-main);
    }

    /* NAV */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 24px;
      padding: 0 32px; height: 64px;
      background: var(--primary-blue);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow);
    }
    .nav-logo { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; margin-right: auto; }
    .nav-logo span { color: var(--success-green); }
    nav a { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; padding: 8px 12px; border-radius: 6px; }
    nav a:hover { color: #fff; background: rgba(255,255,255,0.1); }
    nav a.active { color: var(--success-green); background: rgba(5, 150, 105, 0.1); }
    .nav-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--success-green), #10b981);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; cursor: pointer; color: #fff;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .nav-avatar:hover { transform: scale(1.05); }
      font-weight: 800; font-size: 13px; cursor: pointer; color: #fff;
    }
    .nav-btn {
      padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 13px;
      text-decoration: none; transition: all 0.2s;
    }
    .nav-btn-outline { border: 1px solid var(--border); color: var(--text-dim); }
    .nav-btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn-filled { background: var(--success-green); color: #fff; font-weight: 700; }
    .nav-btn-filled:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3); }

    /* HERO */
    .browse-hero {
      background: linear-gradient(135deg, var(--bg-main) 0%, #f1f5f9 100%);
      border-bottom: 1px solid var(--border);
      padding: 64px 40px 48px;
      text-align: center;
    }
    .browse-hero h1 { font-size: clamp(32px,5vw,56px); font-weight: 800; margin-bottom: 16px; color: var(--text-main); }
    .browse-hero h1 em { font-style: normal; color: var(--primary-blue); }
    .browse-hero p { color: var(--text-secondary); font-size: 18px; margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6; }

    /* SEARCH */
    .search-bar {
      display: flex; gap: 12px; max-width: 720px; margin: 0 auto 32px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 50px;
      padding: 6px 6px 6px 24px;
      box-shadow: var(--shadow);
      transition: all 0.25s;
    }
    .search-bar:focus-within { border-color: var(--primary-blue); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .search-bar input {
      flex: 1; border: none; background: transparent;
      font-size: 16px; color: var(--text-main); outline: none;
      padding: 12px 0;
    }
    .search-bar input::placeholder { color: var(--text-muted); }
    .search-bar button {
      padding: 12px 28px; background: var(--success-green);
      color: #fff; border: none; border-radius: 50px;
      font-weight: 700; font-size: 15px;
      cursor: pointer; transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .search-bar button:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); background: #047857; }

    /* FILTER CHIPS */
    .filter-chips { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 48px; }
    .chip {
      padding: 10px 20px; border-radius: 50px;
      border: 2px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary);
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .chip:hover { border-color: var(--primary-blue); color: var(--primary-blue); transform: translateY(-1px); box-shadow: var(--shadow); }
    .chip.active { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; box-shadow: var(--shadow); }

    /* BODY LAYOUT */
    .browse-body { display: flex; max-width: 1400px; margin: 0 auto; padding: 0 40px 100px; gap: 48px; }

    /* SIDEBAR */
    .sidebar {
      width: 280px; flex-shrink: 0;
      padding: 40px 32px 40px 0;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .sidebar-section { margin-bottom: 32px; }
    .sidebar-title {
      font-weight: 700; font-size: 12px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 16px;
      border-bottom: 1px solid var(--border); padding-bottom: 8px;
    }
    .sidebar-option {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0; cursor: pointer; color: var(--text-main);
      font-size: 15px; transition: all 0.2s; border-radius: 8px; padding-left: 8px; padding-right: 8px;
    }
    .sidebar-option:hover { color: var(--primary-blue); background: rgba(37, 99, 235, 0.05); }
    .sidebar-option input[type="checkbox"],
    .sidebar-option input[type="radio"] { accent-color: var(--primary-blue); width: 16px; height: 16px; cursor: pointer; }

    .availability-toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; }
    .toggle-sw {
      width: 48px; height: 26px; border-radius: 13px;
      background: var(--border); border: none;
      position: relative; cursor: pointer; transition: background 0.3s;
    }
    .toggle-sw.on { background: var(--success-green); }
    .toggle-sw::after {
      content: ''; position: absolute; width: 20px; height: 20px;
      border-radius: 50%; background: white; top: 3px; left: 3px; transition: transform 0.3s;
      box-shadow: var(--shadow-sm);
    }
    .toggle-sw.on::after { transform: translateX(22px); }

    /* RESULTS */
    .results-area { flex: 1; padding: 40px 0 0 0; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .results-count { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .results-count span { color: var(--text-secondary); font-weight: 500; font-size: 16px; }
    .sort-select {
      padding: 12px 20px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 12px; color: var(--text-main);
      font-size: 15px; outline: none; cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .sort-select:hover { border-color: var(--primary-blue); }
    .sort-select:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

    /* PRO CARDS */
    .pros-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px,1fr)); gap: 24px; }
    .pro-card {
      padding: 32px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 20px;
      display: flex; flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .pro-card:hover { transform: translateY(-8px); border-color: var(--primary-blue); box-shadow: var(--shadow-xl); }

    .pro-card-top { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
    .pro-av-wrap { position: relative; display: inline-flex; }
    .pro-avatar {
      width: 64px; height: 64px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: #fff;
      box-shadow: var(--shadow);
    }
    .pro-avail {
      width: 14px; height: 14px; border-radius: 50%; background: var(--success-green);
      border: 3px solid var(--bg-card); position: absolute; bottom: 2px; right: 2px;
      box-shadow: var(--shadow-sm);
    }
    .pro-info { flex: 1; }
    .pro-name { font-weight: 700; font-size: 20px; margin-bottom: 6px; color: var(--text-main); }
    .pro-role-title { font-size: 15px; color: var(--primary-blue); margin-bottom: 8px; font-weight: 600; }
    .pro-rating { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #f59e0b; margin-bottom: 12px; }
    .pro-rating .count { color: var(--text-secondary); font-size: 14px; font-weight: 500; }

    .pro-bio { font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px; flex: 1; }
    .pro-skills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .skill-tag { display: inline-block; padding: 6px 14px; border-radius: 50px; background: rgba(37, 99, 235, 0.1); color: var(--primary-blue); font-size: 12px; font-weight: 600; border: 1px solid rgba(37, 99, 235, 0.2); }

    .pro-card-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 20px; border-top: 1px solid var(--border); margin-top: auto;
    }
    .pro-rate { font-weight: 700; font-size: 16px; color: var(--text-main); }
    .pro-rate span { font-weight: 500; font-size: 14px; color: var(--text-secondary); }

    .btn-ghost {
      padding: 10px 20px;
      background: transparent;
      border: 2px solid var(--border);
      border-radius: 12px; color: var(--text-secondary);
      font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .btn-ghost:hover { background: var(--primary-blue); color: #fff; border-color: var(--primary-blue); transform: translateY(-2px); box-shadow: var(--shadow); }

    /* EMPTY / LOADING */
    .empty { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 18px; grid-column: 1/-1; }
    .loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 16px; grid-column: 1/-1; }

    /* PAGINATION */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 48px; }
    .page-btn {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 2px solid var(--border);
      color: var(--text-secondary); font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; text-decoration: none;
      box-shadow: var(--shadow-sm);
    }
    .page-btn:hover { background: var(--primary-blue); border-color: var(--primary-blue); color: #fff; transform: translateY(-2px); box-shadow: var(--shadow); }
    .page-btn.active { background: var(--success-green); border-color: var(--success-green); color: #fff; box-shadow: var(--shadow); }

    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeInUp 0.5s ease both; }
  </style>

  <!-- MOBILE RESPONSIVE STYLES -->
  <style>
    @media (max-width: 768px) {
      html, body { overflow-x: hidden; }
      nav { padding: 0 16px !important; height: 56px !important; gap: 12px !important; }
      .nav-logo { font-size: 17px !important; }
      nav a:not(.nav-logo):not(.nav-btn):not(.nav-avatar):not(#navDash):not(#navMessages):not(.active) { display: none !important; }
      .hamburger { display: flex !important; }
      .mobile-menu.open { display: flex !important; }
      .hero { flex-direction: column !important; padding: 40px 20px !important; gap: 32px !important; min-height: auto !important; text-align: center; }
      .hero-right { display: none !important; }
      .hero-ctas, .cta-banner-btns { justify-content: center !important; }
      .hero-eyebrow { justify-content: center; }
      .stats-bar { display: grid !important; grid-template-columns: repeat(2,1fr) !important; padding: 24px 20px !important; gap: 20px !important; }
      section { padding: 48px 20px !important; }
      .how-grid, .testi-grid, .why-grid { grid-template-columns: 1fr !important; gap: 14px !important; }
      .cat-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .cta-banner { margin: 0 16px 48px !important; padding: 36px 20px !important; }
      .cta-banner-btns { flex-direction: column !important; align-items: center; }
      footer { flex-direction: column !important; text-align: center; gap: 12px !important; padding: 24px 20px !important; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
    }
    @media (max-width: 900px) {
      .dash-layout, .admin-layout, .messages-layout { flex-direction: column !important; }
      .dash-nav, .dash-sidebar, .admin-sidebar { width: 100% !important; height: auto !important; position: relative !important; top: 0 !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 10px 12px !important; display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; gap: 4px !important; overflow-x: auto !important; }
      .dash-user, .sidebar-user, .dash-nav-section, .dash-nav-label, .sidebar-label { display: none !important; }
      .dash-nav-item, .sidebar-item { flex: none !important; padding: 8px 12px !important; font-size: 12px !important; width: auto !important; }
      .dash-main, .admin-main { padding: 20px 16px 40px !important; }
      .stats-row, .stats-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .two-col, .post-body { grid-template-columns: 1fr !important; gap: 16px !important; }
      .rec-grid, .pros-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .dash-top { flex-direction: column !important; gap: 16px !important; align-items: flex-start !important; }
      .browse-body { flex-direction: column !important; padding: 0 20px 60px !important; }
      .sidebar { width: 100% !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 20px 0 !important; }
      .profile-layout { grid-template-columns: 1fr !important; }
      .contact-card { position: relative !important; top: 0 !important; }
      .profile-header { flex-wrap: wrap !important; margin-top: -30px !important; }
      .profile-body { padding: 0 20px 60px !important; }
      .tips-sidebar { position: relative !important; top: 0 !important; }
      .form-row, .contact-options { grid-template-columns: 1fr !important; gap: 0 !important; }
      .submit-area { flex-direction: column !important; }
      .charts-grid { grid-template-columns: 1fr !important; }
      .portfolio-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 600px) {
      .glass { padding: 28px 20px !important; }
      .register-box { padding: 28px 20px !important; }
      .pw-row { grid-template-columns: 1fr !important; }
      .pros-grid, .rec-grid { grid-template-columns: 1fr !important; }
      input, select, textarea { font-size: 16px !important; }
      .full-card, .glass-card { padding: 16px !important; }
      .post-form { padding: 20px 16px !important; }
      .search-input, .filter-select { width: 100% !important; }
      .filter-bar { flex-direction: column !important; gap: 8px !important; }
    }
    @media (max-width: 768px) {
      body.messages-page { overflow: auto !important; }
      .conv-sidebar { width: 100% !important; height: 220px !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; flex-shrink: 0 !important; }
      .chat-window { height: calc(100vh - 276px) !important; min-height: 380px !important; }
      .msg-bubble { max-width: 85% !important; }
    }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: rgba(255,255,255,0.8); border-radius: 2px; transition: all 0.3s; }
    .mobile-menu { display: none; position: fixed; top: 56px; left: 0; right: 0; background: rgba(15,32,39,0.97); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; z-index: 99; flex-direction: column; gap: 4px; }
    .mobile-menu a { padding: 12px 16px; border-radius: 10px; color: rgba(255,255,255,0.7) !important; text-decoration: none; font-size: 15px; font-weight: 500; display: block !important; }
    .mobile-menu a:hover { background: rgba(255,255,255,0.07); color: #fff !important; }
    .mobile-menu .menu-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }
    @media (max-width: 768px) { .hamburger { display: flex !important; } }
  </style>

</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Skill<span>Connect</span></a>
    <a href="browse.html" class="active">Browse Pros</a>
    <a href="post-need.html">Post a Need</a>
    <a href="messages.html">Messages</a>
    <div class="nav-avatar" id="navAvatar" style="display:none;">?</div>

    <a href="register.html" class="nav-btn nav-btn-filled" id="navRegister">Get Started</a>
  </nav>

  <!-- HERO -->
  <div class="browse-hero fade-up">
    <h1>Find your <em>perfect</em> match</h1>
    <p id="heroSub">Browse verified tech professionals across multiple skill categories</p>
    <div class="search-bar">
      <input type="text" placeholder="Search by name, skill, or keyword..." id="searchInput"/>
      <button onclick="applySearch()">Search</button>
    </div>
    <div class="filter-chips">
      <button class="chip active" onclick="filterBySkill(this,'all')">All</button>
      <button class="chip" onclick="filterBySkill(this,'Frontend Dev')">Frontend Dev</button>
      <button class="chip" onclick="filterBySkill(this,'Backend Dev')">Backend Dev</button>
      <button class="chip" onclick="filterBySkill(this,'Cybersecurity')">Cybersecurity</button>
      <button class="chip" onclick="filterBySkill(this,'Mobile Dev')">Mobile Dev</button>
      <button class="chip" onclick="filterBySkill(this,'UI / UX Design')">UI / UX</button>
      <button class="chip" onclick="filterBySkill(this,'Data Analysis')">Data Analysis</button>
      <button class="chip" onclick="filterBySkill(this,'DevOps')">DevOps</button>
    </div>
  </div>

  <div class="browse-body">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Availability</div>
        <div class="availability-toggle">
          <span style="font-size:15px;color:var(--text-secondary);font-weight:500;">Available Now</span>
          <div class="toggle-sw on" onclick="this.classList.toggle('on')"></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Skills</div>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Frontend Development</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Backend Development</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Cybersecurity</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Mobile Development</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> UI/UX Design</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Data Science</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> DevOps</label>
        <label class="sidebar-option"><input type="checkbox" onchange="applyFilters()"/> Cloud Architecture</label>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Experience Level</div>
        <label class="sidebar-option"><input type="radio" name="experience" value="all" checked onchange="applyFilters()"/> All Levels</label>
        <label class="sidebar-option"><input type="radio" name="experience" value="junior" onchange="applyFilters()"/> Junior (1-3 years)</label>
        <label class="sidebar-option"><input type="radio" name="experience" value="mid" onchange="applyFilters()"/> Mid-level (3-5 years)</label>
        <label class="sidebar-option"><input type="radio" name="experience" value="senior" onchange="applyFilters()"/> Senior (5+ years)</label>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Hourly Rate</div>
        <label class="sidebar-option"><input type="radio" name="rate" value="all" checked onchange="applyFilters()"/> Any Rate</label>
        <label class="sidebar-option"><input type="radio" name="rate" value="budget" onchange="applyFilters()"/> Under $50/hr</label>
        <label class="sidebar-option"><input type="radio" name="rate" value="standard" onchange="applyFilters()"/> $50-$100/hr</label>
        <label class="sidebar-option"><input type="radio" name="rate" value="premium" onchange="applyFilters()"/> $100+/hr</label>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="results-area">
      <div class="results-header">
        <div class="results-count" id="resultsCount">Loading... <span>professionals</span></div>
        <select class="sort-select" onchange="applyFilters()">
          <option value="newest">Sort: Newest</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>

      <div class="pros-grid" id="prosGrid">
        <div class="loading">Loading professionals...</div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const API = 'https://skillconnect-backend-production.up.railway.app/api'
    let allPros = []
    let activeSkill = 'all'
    const COLORS = [
      'linear-gradient(135deg,#8ab4f8,#7b61ff)',
      'linear-gradient(135deg,#00e682,#8ab4f8)',
      'linear-gradient(135deg,#7b61ff,#ff6b6b)',
      'linear-gradient(135deg,#ff6b6b,#ff8e53)',
      'linear-gradient(135deg,#00d4ff,#7b61ff)',
      'linear-gradient(135deg,#ffc940,#ff6b6b)',
    ]
    const PER_PAGE = 6
    let currentPage = 1

    window.addEventListener('DOMContentLoaded', () => {
      // Setup nav based on login state
      const user = JSON.parse(localStorage.getItem('user') || 'null')
      if (user) {

      }

      loadPros()

      document.getElementById('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') applySearch()
      })
    })

    function filterBySkill(btn, skill) {
      document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'))
      btn.classList.add('active')
      activeSkill = skill
      currentPage = 1
      applyFilters()
    }

    function applySearch() {
      currentPage = 1
      applyFilters()
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim()
      const checkedSkills = [...document.querySelectorAll('.sidebar-option input[type="checkbox"]:checked')]
        .map(el => el.parentElement.textContent.trim())
      const sortVal = document.querySelector('.sort-select').value

      let filtered = allPros.filter(p => {
        let skills = []
        try { skills = Array.isArray(p.skills) ? p.skills : JSON.parse(p.skills || '[]') } catch {}

        // Chip filter
        if (activeSkill !== 'all') {
          const hasSkill = skills.some(s => s.toLowerCase().includes(activeSkill.toLowerCase()))
          if (!hasSkill) return false
        }

        // Sidebar checkbox filter
        if (checkedSkills.length > 0) {
          const hasAny = checkedSkills.some(cs => skills.some(s => s.toLowerCase().includes(cs.toLowerCase())))
          if (!hasAny) return false
        }

        // Search query
        if (query) {
          const searchable = `${p.name} ${p.bio || ''} ${skills.join(' ')}`.toLowerCase()
          if (!searchable.includes(query)) return false
        }

        return true
      })

      // Sort
      if (sortVal === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name))

      renderPros(filtered)
    }

    function renderPros(pros) {
      const grid = document.getElementById('prosGrid')
      const total = pros.length
      const start = (currentPage - 1) * PER_PAGE
      const paged = pros.slice(start, start + PER_PAGE)

      document.getElementById('resultsCount').innerHTML =
        `${total} <span>professional${total !== 1 ? 's' : ''} found</span>`

      if (!paged.length) {
        grid.innerHTML = `<div class="empty">No professionals found. Try a different search or filter.</div>`
        document.getElementById('pagination').innerHTML = ''
        return
      }

      grid.innerHTML = paged.map((p, i) => {
        const initials = p.avatar || p.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)
        let skills = p.skills || []
        const color = COLORS[(start + i) % COLORS.length]
        const stars = '★'.repeat(Math.floor(p.rating || 5)) + '☆'.repeat(5 - Math.floor(p.rating || 5))

        return `
          <div class="pro-card">
            <div class="pro-card-top">
              <div class="pro-av-wrap">
                <div class="pro-avatar" style="background:${color}">${initials}</div>
                <span class="pro-avail"></span>
              </div>
              <div class="pro-info">
                <div class="pro-name">${p.name}</div>
                <div class="pro-role-title">${skills[0] || 'Professional'}</div>
                <div class="pro-rating">${stars} <span class="count">(${p.reviews || 0} reviews)</span></div>
              </div>
            </div>
            <p class="pro-bio">${p.bio}</p>
            <div class="pro-skills">${skills.slice(0,4).map(s=>`<span class="skill-tag">${s}</span>`).join('')}</div>
            <div class="pro-card-footer">
              <div class="pro-rate">$${p.hourlyRate || 50}/hr <span>avg rate</span></div>
              <a href="profile.html?id=${p.id}" class="btn-ghost">View Profile</a>
            </div>
          </div>
        `
      }).join('')

      renderPagination(pros)
    }

    function renderPagination(pros) {
      const totalPages = Math.ceil(pros.length / PER_PAGE)
      const pag = document.getElementById('pagination')
      if (totalPages <= 1) { pag.innerHTML = ''; return }

      let html = `<a class="page-btn" onclick="changePage(${currentPage-1}, event)">←</a>`
      for (let i = 1; i <= totalPages; i++) {
        html += `<a class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i}, event)">${i}</a>`
      }
      html += `<a class="page-btn" onclick="changePage(${currentPage+1}, event)">→</a>`
      pag.innerHTML = html
    }

    function changePage(page, e) {
      e.preventDefault()
      const totalPages = Math.ceil(allPros.length / PER_PAGE)
      if (page < 1 || page > totalPages) return
      currentPage = page
      applyFilters()
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  </script>

  <!-- MOBILE HAMBURGER MENU -->
  <script>
    (function() {
      // Add hamburger button and mobile menu to nav
      window.addEventListener('DOMContentLoaded', function() {
        const nav = document.querySelector('nav');
        if (!nav) return;

        // Create hamburger
        const hamburger = document.createElement('button');
        hamburger.className = 'hamburger';
        hamburger.setAttribute('aria-label', 'Menu');
        hamburger.innerHTML = '<span></span><span></span><span></span>';
        nav.appendChild(hamburger);

        // Create mobile menu
        const mobileMenu = document.createElement('div');
        mobileMenu.className = 'mobile-menu';
        mobileMenu.id = 'mobileMenu';

        // Get nav links
        const links = nav.querySelectorAll('a:not(.nav-logo)');
        links.forEach(link => {
          const clone = link.cloneNode(true);
          mobileMenu.appendChild(clone);
        });

        // Add sign out if logged in
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user) {
          const divider = document.createElement('div');
          divider.className = 'menu-divider';
          mobileMenu.appendChild(divider);
          const signout = document.createElement('a');
          signout.href = '#';
          signout.textContent = '🚪 Sign Out';
          signout.style.color = '#ff8080';
          signout.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
          });
          mobileMenu.appendChild(signout);
        }

        document.body.appendChild(mobileMenu);

        hamburger.addEventListener('click', function() {
          mobileMenu.classList.toggle('open');
        });

        // Close on outside click
        document.addEventListener('click', function(e) {
          if (!nav.contains(e.target)) {
            mobileMenu.classList.remove('open');
          }
        });
      });
    })();
  </script>
