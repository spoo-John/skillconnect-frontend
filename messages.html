<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — SkillConnect</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-sidebar: #f1f5f9;
      --border: #e2e8f0;
      --primary-blue: #2563eb;
      --success-green: #059669;
      --text-main: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100vh; overflow: hidden;
      background: var(--bg-main);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      color: var(--text-main);
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 24px;
      padding: 0 32px; height: 60px;
      background: var(--primary-blue);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }
    .nav-logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; margin-right: auto; }
    .nav-logo span { color: var(--accent); }
    nav a { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
    nav a:hover { color: rgba(255,255,255,0.8); }
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; cursor: pointer; color: #fff;
    }
    .nav-btn { padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
    .nav-btn:hover { border-color: #fff; }

    /* LAYOUT */
    .messages-layout {
      display: flex;
      height: calc(100vh - 60px);
      margin-top: 60px;
      position: relative; z-index: 1;
    }

    /* CONVERSATIONS SIDEBAR */
    .conv-sidebar {
      width: 300px; flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
    }
    .conv-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .conv-header h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .conv-search {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 14px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50px; transition: border-color 0.25s;
    }
    .conv-search:focus-within { border-color: #8ab4f8; }
    .conv-search input { flex: 1; border: none; background: transparent; color: #fff; font-size: 13px; outline: none; }
    .conv-search input::placeholder { color: rgba(255,255,255,0.3); }

    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item {
      display: flex; gap: 12px; align-items: center;
      padding: 13px 16px;
      cursor: pointer; transition: background 0.2s;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .conv-item:hover { background: rgba(255,255,255,0.04); }
    .conv-item.active { background: rgba(138,180,248,0.1); border-right: 2px solid #8ab4f8; }
    .conv-av-wrap { position: relative; flex-shrink: 0; }
    .conv-av { width: 42px; height: 42px; font-size: 15px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
    .conv-online { width: 10px; height: 10px; border-radius: 50%; background: #00e682; border: 2px solid #0f2027; position: absolute; bottom: -1px; right: -1px; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    .conv-preview { font-size: 12px; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
    .conv-time { font-size: 11px; color: rgba(255,255,255,0.35); }
    .conv-unread { background: #8ab4f8; color: #0f2027; font-size: 10px; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .conv-empty { padding: 40px 20px; text-align: center; color: rgba(255,255,255,0.35); font-size: 13px; }

    /* CHAT WINDOW */
    .chat-window { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.15); }

    /* CHAT HEADER */
    .chat-header {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
    }
    .chat-header-av { width: 40px; height: 40px; font-size: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 700; font-size: 15px; }
    .chat-header-status { font-size: 12px; color: #00e682; margin-top: 1px; }
    .chat-header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; font-size: 14px; text-decoration: none; color: #fff;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.12); }

    /* MESSAGES AREA */
    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }

    .day-divider { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); display: flex; align-items: center; gap: 12px; }
    .day-divider::before, .day-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.07); }

    .msg-group { display: flex; flex-direction: column; gap: 4px; }
    .msg-row { display: flex; gap: 8px; align-items: flex-end; }
    .msg-row.sent { flex-direction: row-reverse; }
    .msg-bubble {
      max-width: 440px; padding: 11px 15px;
      border-radius: 16px; font-size: 14px; line-height: 1.6;
    }
    .msg-row.received .msg-bubble {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px; color: #fff;
    }
    .msg-row.sent .msg-bubble {
      background: #8ab4f8; color: #0f2027;
      border-bottom-right-radius: 4px; font-weight: 500;
    }
    .msg-time { font-size: 11px; color: rgba(255,255,255,0.35); padding: 0 4px 2px; white-space: nowrap; }
    .msg-av-sm { width: 28px; height: 28px; font-size: 10px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; flex-shrink: 0; }

    .typing-indicator { display: flex; align-items: center; gap: 8px; }
    .typing-dots { display: flex; gap: 4px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 16px; border-bottom-left-radius: 4px; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: typingBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* INPUT */
    .chat-input-area {
      padding: 14px 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
    }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .chat-input-wrap {
      flex: 1; background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: 11px 16px;
      transition: border-color 0.25s;
    }
    .chat-input-wrap:focus-within { border-color: #8ab4f8; }
    .chat-textarea {
      width: 100%; background: transparent; border: none;
      color: #fff; font-family: "Segoe UI", sans-serif; font-size: 14px;
      outline: none; resize: none; max-height: 120px; line-height: 1.5;
    }
    .chat-textarea::placeholder { color: rgba(255,255,255,0.3); }
    .send-btn {
      width: 44px; height: 44px; background: #8ab4f8;
      border: none; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; font-size: 16px; flex-shrink: 0; color: #0f2027;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(138,180,248,0.4); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* EMPTY STATE */
    .empty-chat {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.35); text-align: center; padding: 40px;
    }
    .empty-icon { font-size: 52px; margin-bottom: 16px; opacity: 0.5; }
    .empty-title { font-weight: 700; font-size: 20px; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; line-height: 1.6; }

    .loading-msg { text-align: center; padding: 20px; color: rgba(255,255,255,0.4); font-size: 13px; }

    /* MSG status */
    .msg-status { font-size: 10px; color: rgba(255,255,255,0.35); text-align: right; margin-top: 2px; }
  </style>

  <!-- MOBILE RESPONSIVE STYLES -->
  <style>
    @media (max-width: 768px) {
      html, body { overflow-x: hidden; }
      nav { padding: 0 16px !important; height: 56px !important; gap: 12px !important; }
      .nav-logo { font-size: 17px !important; }
      nav a:not(.nav-logo):not(.nav-btn):not(.nav-avatar):not(#navDash):not(#navMessages):not(.active) { display: none !important; }
      .hamburger { display: flex !important; }
      .mobile-menu.open { display: flex !important; }
      .hero { flex-direction: column !important; padding: 40px 20px !important; gap: 32px !important; min-height: auto !important; text-align: center; }
      .hero-right { display: none !important; }
      .hero-ctas, .cta-banner-btns { justify-content: center !important; }
      .hero-eyebrow { justify-content: center; }
      .stats-bar { display: grid !important; grid-template-columns: repeat(2,1fr) !important; padding: 24px 20px !important; gap: 20px !important; }
      section { padding: 48px 20px !important; }
      .how-grid, .testi-grid, .why-grid { grid-template-columns: 1fr !important; gap: 14px !important; }
      .cat-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .cta-banner { margin: 0 16px 48px !important; padding: 36px 20px !important; }
      .cta-banner-btns { flex-direction: column !important; align-items: center; }
      footer { flex-direction: column !important; text-align: center; gap: 12px !important; padding: 24px 20px !important; }
      .footer-links { flex-wrap: wrap; justify-content: center; }
    }
    @media (max-width: 900px) {
      .dash-layout, .admin-layout, .messages-layout { flex-direction: column !important; }
      .dash-nav, .dash-sidebar, .admin-sidebar { width: 100% !important; height: auto !important; position: relative !important; top: 0 !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 10px 12px !important; display: flex !important; flex-direction: row !important; flex-wrap: wrap !important; gap: 4px !important; overflow-x: auto !important; }
      .dash-user, .sidebar-user, .dash-nav-section, .dash-nav-label, .sidebar-label { display: none !important; }
      .dash-nav-item, .sidebar-item { flex: none !important; padding: 8px 12px !important; font-size: 12px !important; width: auto !important; }
      .dash-main, .admin-main { padding: 20px 16px 40px !important; }
      .stats-row, .stats-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .two-col, .post-body { grid-template-columns: 1fr !important; gap: 16px !important; }
      .rec-grid, .pros-grid { grid-template-columns: repeat(2,1fr) !important; gap: 12px !important; }
      .dash-top { flex-direction: column !important; gap: 16px !important; align-items: flex-start !important; }
      .browse-body { flex-direction: column !important; padding: 0 20px 60px !important; }
      .sidebar { width: 100% !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 20px 0 !important; }
      .profile-layout { grid-template-columns: 1fr !important; }
      .contact-card { position: relative !important; top: 0 !important; }
      .profile-header { flex-wrap: wrap !important; margin-top: -30px !important; }
      .profile-body { padding: 0 20px 60px !important; }
      .tips-sidebar { position: relative !important; top: 0 !important; }
      .form-row, .contact-options { grid-template-columns: 1fr !important; gap: 0 !important; }
      .submit-area { flex-direction: column !important; }
      .charts-grid { grid-template-columns: 1fr !important; }
      .portfolio-grid { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 600px) {
      .glass { padding: 28px 20px !important; }
      .register-box { padding: 28px 20px !important; }
      .pw-row { grid-template-columns: 1fr !important; }
      .pros-grid, .rec-grid { grid-template-columns: 1fr !important; }
      input, select, textarea { font-size: 16px !important; }
      .full-card, .glass-card { padding: 16px !important; }
      .post-form { padding: 20px 16px !important; }
      .search-input, .filter-select { width: 100% !important; }
      .filter-bar { flex-direction: column !important; gap: 8px !important; }
    }
    @media (max-width: 768px) {
      body.messages-page { overflow: auto !important; }
      .conv-sidebar { width: 100% !important; height: 220px !important; border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; flex-shrink: 0 !important; }
      .chat-window { height: calc(100vh - 276px) !important; min-height: 380px !important; }
      .msg-bubble { max-width: 85% !important; }
    }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: rgba(255,255,255,0.8); border-radius: 2px; transition: all 0.3s; }
    .mobile-menu { display: none; position: fixed; top: 56px; left: 0; right: 0; background: rgba(15,32,39,0.97); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; z-index: 99; flex-direction: column; gap: 4px; }
    .mobile-menu a { padding: 12px 16px; border-radius: 10px; color: rgba(255,255,255,0.7) !important; text-decoration: none; font-size: 15px; font-weight: 500; display: block !important; }
    .mobile-menu a:hover { background: rgba(255,255,255,0.07); color: #fff !important; }
    .mobile-menu .menu-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }
    @media (max-width: 768px) { .hamburger { display: flex !important; } }
  </style>

</head>
<body class="messages-page">

  <nav>
    <a href="index.html" class="nav-logo">Skill<span>Connect</span></a>
    <a href="browse.html">Browse Pros</a>
    <a href="post-need.html">Post a Need</a>
    <a href="dashboard.html" class="nav-btn">Dashboard</a>
    <div class="nav-avatar" id="navAvatar">?</div>
  </nav>

  <div class="messages-layout">

    <!-- CONVERSATIONS LIST -->
    <div class="conv-sidebar">
      <div class="conv-header">
        <h3>Messages</h3>
        <div class="conv-search">
          <span style="color:rgba(255,255,255,0.35)">🔍</span>
          <input type="text" placeholder="Search conversations..." id="searchConv" oninput="searchConversations()"/>
        </div>
      </div>
      <div class="conv-list" id="convList">
        <div class="conv-empty">Loading conversations...</div>
      </div>
    </div>

    <!-- CHAT WINDOW -->
    <div class="chat-window" id="chatWindow">
      <div class="empty-chat">
        <div class="empty-icon">💬</div>
        <div class="empty-title">Your Messages</div>
        <div class="empty-sub">Select a conversation to start chatting,<br>or message a professional from their profile.</div>
      </div>
    </div>

  </div>

  <script>
    const API = 'https://skillconnect-backend-production.up.railway.app/api'
    let currentUser = null
    let currentConvId = null
    let currentReceiverId = null
    let conversations = []
    let pollInterval = null

    const COLORS = [
      'linear-gradient(135deg,#8ab4f8,#7b61ff)',
      'linear-gradient(135deg,#00e682,#8ab4f8)',
      'linear-gradient(135deg,#7b61ff,#ff6b6b)',
      'linear-gradient(135deg,#ff6b6b,#ff8e53)',
      'linear-gradient(135deg,#00d4ff,#7b61ff)',
    ]

    window.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token')
      const user = JSON.parse(localStorage.getItem('user') || 'null')

      if (!token || !user) { window.location.href = 'login.html'; return }

      currentUser = user
      const initials = user.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2)
      document.getElementById('navAvatar').textContent = initials

      // Load professionals to build conversation list
      await loadConversations()

      // Check if coming from profile page with ?to=userId
      const params = new URLSearchParams(window.location.search)
      const toId = params.get('to')
      if (toId) {
        const conv = conversations.find(c => String(c.userId) === String(toId))
        if (conv) openChat(conv)
      }
    })

    async function loadConversations() {
      try {
        const res = await fetch(`${API}/users`)
        const pros = await res.json()
        if (!Array.isArray(pros) || !pros.length) {
          // Fallback to sample conversations
          conversations = [
            { userId: 1, name: 'Sarah Chen', role: 'UI/UX Designer', initials: 'SC', color: COLORS[0], convId: 'conv_sample_1' },
            { userId: 2, name: 'Marcus Rodriguez', role: 'Full-Stack Developer', initials: 'MR', color: COLORS[1], convId: 'conv_sample_2' },
            { userId: 3, name: 'Emily Watson', role: 'Data Analyst', initials: 'EW', color: COLORS[2], convId: 'conv_sample_3' },
            { userId: 4, name: 'David Kim', role: 'DevOps Engineer', initials: 'DK', color: COLORS[3], convId: 'conv_sample_4' },
            { userId: 5, name: 'Lisa Thompson', role: 'Product Manager', initials: 'LT', color: COLORS[4], convId: 'conv_sample_5' }
          ]
          renderConvList(conversations)
          return
        }

        // Build conversation list from professionals (excluding self)
        conversations = pros
          .filter(p => p.id !== currentUser.id)
          .map((p, i) => {
            let skills = []
            try { skills = Array.isArray(p.skills) ? p.skills : JSON.parse(p.skills || '[]') } catch {}
            return {
              userId: p.id,
              name: p.name,
              role: skills[0] || 'Professional',
              initials: p.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2),
              color: COLORS[i % COLORS.length],
              convId: `conv_${Math.min(currentUser.id, p.id)}_${Math.max(currentUser.id, p.id)}`
            }
          })

        renderConvList(conversations)
      } catch {
        // Fallback to sample conversations on error
        conversations = [
          { userId: 1, name: 'Sarah Chen', role: 'UI/UX Designer', initials: 'SC', color: COLORS[0], convId: 'conv_sample_1' },
          { userId: 2, name: 'Marcus Rodriguez', role: 'Full-Stack Developer', initials: 'MR', color: COLORS[1], convId: 'conv_sample_2' },
          { userId: 3, name: 'Emily Watson', role: 'Data Analyst', initials: 'EW', color: COLORS[2], convId: 'conv_sample_3' },
          { userId: 4, name: 'David Kim', role: 'DevOps Engineer', initials: 'DK', color: COLORS[3], convId: 'conv_sample_4' },
          { userId: 5, name: 'Lisa Thompson', role: 'Product Manager', initials: 'LT', color: COLORS[4], convId: 'conv_sample_5' }
        ]
        renderConvList(conversations)
      }
    }

    function renderConvList(convs) {
      if (!convs.length) {
        document.getElementById('convList').innerHTML = `<div class="conv-empty">No conversations yet.</div>`
        return
      }
      document.getElementById('convList').innerHTML = convs.map(c => `
        <div class="conv-item ${currentConvId === c.convId ? 'active' : ''}" onclick="openChatById('${c.convId}', ${c.userId})">
          <div class="conv-av-wrap">
            <div class="conv-av" style="background:${c.color}">${c.initials}</div>
            <span class="conv-online"></span>
          </div>
          <div class="conv-info">
            <div class="conv-name">${c.name}</div>
            <div class="conv-preview">${c.role}</div>
          </div>
          <div class="conv-meta">
            <span class="conv-time">—</span>
          </div>
        </div>
      `).join('')
    }

    function searchConversations() {
      const q = document.getElementById('searchConv').value.toLowerCase()
      const filtered = conversations.filter(c => c.name.toLowerCase().includes(q) || c.role.toLowerCase().includes(q))
      renderConvList(filtered)
    }

    function openChatById(convId, userId) {
      const conv = conversations.find(c => c.convId === convId && c.userId === userId)
      if (conv) openChat(conv)
    }

    function openChat(conv) {
      if (pollInterval) clearInterval(pollInterval)

      currentConvId = conv.convId
      currentReceiverId = conv.userId

      // Mark active in sidebar
      document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'))
      const items = document.querySelectorAll('.conv-item')
      items.forEach(el => {
        if (el.querySelector('.conv-name')?.textContent === conv.name) el.classList.add('active')
      })

      // Render chat window
      document.getElementById('chatWindow').innerHTML = `
        <div class="chat-header">
          <div class="chat-header-av" style="background:${conv.color}">${conv.initials}</div>
          <div class="chat-header-info">
            <div class="chat-header-name">${conv.name}</div>
            <div class="chat-header-status">● Online</div>
          </div>
          <div class="chat-header-actions">
            <a href="profile.html?id=${conv.userId}" class="icon-btn" title="View Profile">👤</a>
          </div>
        </div>

        <div class="messages-area" id="messagesArea">
          <div class="loading-msg">Loading messages...</div>
        </div>

        <div class="chat-input-area">
          <div class="input-row">
            <div class="chat-input-wrap">
              <textarea class="chat-textarea" id="msgInput" rows="1"
                placeholder="Type a message..."
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
          </div>
        </div>
      `

      loadMessages(conv.convId)
      pollInterval = setInterval(() => loadMessages(conv.convId), 4000)
    }

    function getSampleMessages(convId) {
      const sampleData = {
        'conv_sample_1': [
          { sender_id: 1, text: 'Hi! I saw your project on SkillConnect. I\'m a UI/UX designer with 5+ years experience.', timestamp: new Date(Date.now() - 2*60*60*1000).toISOString() },
          { sender_id: currentUser?.id || 999, text: 'Hello Sarah! Thanks for reaching out. We\'re looking for someone to redesign our mobile app.', timestamp: new Date(Date.now() - 1.5*60*60*1000).toISOString() },
          { sender_id: 1, text: 'That sounds exciting! I\'d love to see your current design. Do you have any wireframes or mockups?', timestamp: new Date(Date.now() - 1*60*60*1000).toISOString() },
          { sender_id: currentUser?.id || 999, text: 'Yes, I can share our current screens. We want a more modern, clean look with better user flow.', timestamp: new Date(Date.now() - 30*60*1000).toISOString() }
        ],
        'conv_sample_2': [
          { sender_id: 2, text: 'Hello! I\'m interested in your full-stack development project. What tech stack are you using?', timestamp: new Date(Date.now() - 4*60*60*1000).toISOString() },
          { sender_id: currentUser?.id || 999, text: 'Hi Marcus! We\'re building with React, Node.js, and PostgreSQL. It\'s a SaaS platform.', timestamp: new Date(Date.now() - 3.5*60*60*1000).toISOString() },
          { sender_id: 2, text: 'Perfect! I have extensive experience with that stack. I built similar platforms before.', timestamp: new Date(Date.now() - 3*60*60*1000).toISOString() }
        ],
        'conv_sample_3': [
          { sender_id: 3, text: 'Hi there! I noticed you need data analysis help. What kind of data are you working with?', timestamp: new Date(Date.now() - 6*60*60*1000).toISOString() },
          { sender_id: currentUser?.id || 999, text: 'Hello Emily! We have customer behavior data and want to identify trends and insights.', timestamp: new Date(Date.now() - 5.5*60*60*1000).toISOString() }
        ],
        'conv_sample_4': [
          { sender_id: 4, text: 'Greetings! I\'m a DevOps engineer specializing in cloud infrastructure. What are your deployment needs?', timestamp: new Date(Date.now() - 8*60*60*1000).toISOString() }
        ],
        'conv_sample_5': [
          { sender_id: 5, text: 'Hello! As a product manager, I can help you define requirements and scope your project properly.', timestamp: new Date(Date.now() - 10*60*60*1000).toISOString() },
          { sender_id: currentUser?.id || 999, text: 'Hi Lisa! That would be great. We need help organizing our feature backlog and prioritizing.', timestamp: new Date(Date.now() - 9.5*60*60*1000).toISOString() }
        ]
      }
      return sampleData[convId] || []
    }

    function renderMessages(msgs, convId) {
      const area = document.getElementById('messagesArea')
      if (!area) return

      if (!Array.isArray(msgs) || !msgs.length) {
        area.innerHTML = `<div class="empty-chat" style="flex:none;padding:40px 0;"><div class="empty-icon">💬</div><div style="color:rgba(255,255,255,0.4);font-size:14px;">No messages yet. Say hello!</div></div>`
        return
      }

      const conv = conversations.find(c => c.convId === convId)
      const scrolledToBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 50

      area.innerHTML = msgs.map(m => {
        const isSent = m.sender_id === (currentUser?.id || 999)
        const time = new Date(m.timestamp).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })
        return `
          <div class="msg-group">
            <div class="msg-row ${isSent ? 'sent' : 'received'}">
              ${!isSent ? `<div class="msg-av-sm" style="background:${conv?.color || COLORS[0]}">${conv?.initials || '?'}</div>` : ''}
              <div class="msg-bubble">${escapeHtml(m.text)}</div>
            </div>
            <div class="msg-row ${isSent ? 'sent' : 'received'}">
              ${!isSent ? `<div style="width:28px;flex-shrink:0;"></div>` : ''}
              <div class="msg-time">${time}</div>
            </div>
          </div>
        `
      }).join('')

      if (scrolledToBottom) area.scrollTop = area.scrollHeight
    }

    async function loadMessages(convId) {
      const token = localStorage.getItem('token')
      try {
        const res = await fetch(`${API}/messages/${convId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        const msgs = await res.json()
        const area = document.getElementById('messagesArea')
        if (!area) return

        if (!Array.isArray(msgs) || !msgs.length) {
          // Fallback to sample messages
          const sampleMsgs = getSampleMessages(convId)
          renderMessages(sampleMsgs, convId)
          return
        }

        const conv = conversations.find(c => c.convId === convId)
        const scrolledToBottom = area.scrollHeight - area.scrollTop <= area.clientHeight + 50

        area.innerHTML = msgs.map(m => {
          const isSent = m.sender_id === currentUser.id
          const time = new Date(m.timestamp).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })
          return `
            <div class="msg-group">
              <div class="msg-row ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `<div class="msg-av-sm" style="background:${conv?.color || COLORS[0]}">${conv?.initials || '?'}</div>` : ''}
                <div class="msg-bubble">${escapeHtml(m.text)}</div>
              </div>
              <div class="msg-row ${isSent ? 'sent' : 'received'}">
                ${!isSent ? `<div style="width:28px;flex-shrink:0;"></div>` : ''}
                <div class="msg-time">${time}</div>
              </div>
            </div>
          `
        }).join('')

        if (scrolledToBottom) area.scrollTop = area.scrollHeight
      } catch {
        // Fallback to sample messages on error
        const sampleMsgs = getSampleMessages(convId)
        renderMessages(sampleMsgs, convId)
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput')
      const btn = document.getElementById('sendBtn')
      const text = input?.value.trim()
      if (!text || !currentConvId || !currentReceiverId) return

      const token = localStorage.getItem('token')
      btn.disabled = true

      try {
        const res = await fetch(`${API}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            receiver_id: currentReceiverId,
            text,
            conversation_id: currentConvId
          })
        })

        if (res.ok) {
          input.value = ''
          input.style.height = 'auto'
          await loadMessages(currentConvId)
          const area = document.getElementById('messagesArea')
          if (area) area.scrollTop = area.scrollHeight
        }
      } catch {}
      finally { btn.disabled = false }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage() }
    }

    function autoResize(el) {
      el.style.height = 'auto'
      el.style.height = Math.min(el.scrollHeight, 120) + 'px'
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')
    }
  </script>

  <!-- MOBILE HAMBURGER MENU -->
  <script>
    (function() {
      // Add hamburger button and mobile menu to nav
      window.addEventListener('DOMContentLoaded', function() {
        const nav = document.querySelector('nav');
        if (!nav) return;

        // Create hamburger
        const hamburger = document.createElement('button');
        hamburger.className = 'hamburger';
        hamburger.setAttribute('aria-label', 'Menu');
        hamburger.innerHTML = '<span></span><span></span><span></span>';
        nav.appendChild(hamburger);

        // Create mobile menu
        const mobileMenu = document.createElement('div');
        mobileMenu.className = 'mobile-menu';
        mobileMenu.id = 'mobileMenu';

        // Get nav links
        const links = nav.querySelectorAll('a:not(.nav-logo)');
        links.forEach(link => {
          const clone = link.cloneNode(true);
          mobileMenu.appendChild(clone);
        });

        // Add sign out if logged in
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (user) {
          const divider = document.createElement('div');
          divider.className = 'menu-divider';
          mobileMenu.appendChild(divider);
          const signout = document.createElement('a');
          signout.href = '#';
          signout.textContent = '🚪 Sign Out';
          signout.style.color = '#ff8080';
          signout.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
          });
          mobileMenu.appendChild(signout);
        }

        document.body.appendChild(mobileMenu);

        hamburger.addEventListener('click', function() {
          mobileMenu.classList.toggle('open');
        });

        // Close on outside click
        document.addEventListener('click', function(e) {
          if (!nav.contains(e.target)) {
            mobileMenu.classList.remove('open');
          }
        });
      });
    })();
  </script>
